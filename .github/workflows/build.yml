name: Compilar Arise Trainer para Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Compilar con PyInstaller
        run: pyinstaller arise.spec --noconfirm

      - name: Probar que el .exe arranca y carga la IA
        shell: pwsh
        run: |
          $env:ARISE_DATA = "$env:RUNNER_TEMP\arise-test"
          $p = Start-Process -FilePath "dist\AriseTrainer\AriseTrainer.exe" -ArgumentList "--autotest" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "El .exe no terminó la prueba"; exit 1 }
          $r = Get-Content "$env:ARISE_DATA\autotest.txt" -ErrorAction SilentlyContinue
          Write-Host "Resultado: $r"
          if ($r -ne "OK") { exit 1 }

      - name: Crear instalador
        shell: pwsh
        run: |
          $env:ARISE_VERSION = "1.1.${{ github.run_number }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer.iss
          Compress-Archive -Path dist\AriseTrainer\* -DestinationPath dist\AriseTrainer-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AriseTrainer-Windows
          path: |
            dist/AriseTrainer-Instalador.exe
            dist/AriseTrainer-portable.zip

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Arise Trainer 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Descargá `AriseTrainer-Instalador.exe`**, ejecutalo y listo.
            (Si Windows muestra "Windows protegió tu PC": *Más información* → *Ejecutar de todas formas*.)

            `AriseTrainer-portable.zip` es la versión sin instalar: descomprimila y abrí `AriseTrainer.exe`.
          files: |
            dist/AriseTrainer-Instalador.exe
            dist/AriseTrainer-portable.zip
